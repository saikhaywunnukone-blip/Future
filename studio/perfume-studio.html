<title>ရေမွေး Review Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Serif+Myanmar:wght@600&display=swap">
<style>
/* Layout: a top bar holding the new-brief field, a library rail of saved perfumes on the left and the open brief on the right; one column on phones */
:root {
  --bg: #F1F2F6;
  --surface: #FFFFFF;
  --ink: #1A1C28;
  --muted: #5D6173;
  --line: #D9DBE3;
  --amber: #93600F;
  --amber-soft: #F3E6CE;
  --navy: #24315E;
  --navy-soft: #E3E7F3;
  --good: #2E7A4D;
  --warn: #9A5800;
  --bad: #B03838;
  --f-display: "Bodoni Moda", "Noto Serif Myanmar", Didot, Georgia, serif;
  --f-body: "Instrument Sans", "Noto Sans Myanmar", "Myanmar Text", Padauk, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111219; --surface: #1A1C26; --ink: #ECEAE4; --muted: #A3A6B5; --line: #2D303E;
    --amber: #E0AA55; --amber-soft: #3A2E1A; --navy: #A9B9EE; --navy-soft: #232A44;
    --good: #6FC28F; --warn: #E4A04A; --bad: #E57A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111219; --surface: #1A1C26; --ink: #ECEAE4; --muted: #A3A6B5; --line: #2D303E;
  --amber: #E0AA55; --amber-soft: #3A2E1A; --navy: #A9B9EE; --navy-soft: #232A44;
  --good: #6FC28F; --warn: #E4A04A; --bad: #E57A7A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.8; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.35; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--navy); }

.app {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
  display: grid; gap: 20px;
}

/* top bar */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 24px; align-items: center; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand .mm { font-family: "Noto Serif Myanmar", var(--f-display); font-size: 22px; font-weight: 600; }
.brand .en { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--amber); }
.new { display: flex; gap: 8px; min-width: 0; }
.new input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.new input::placeholder { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--amber); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; padding: 10px 18px; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.gen { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--amber-soft); font-size: 14px; }
.gen .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
.gen.err { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.gen.err .dot { background: var(--bad); animation: none; }
@keyframes pulse { 50% { opacity: .25; } }
.note-line { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 0; }

/* layout */
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
.lib { display: grid; gap: 6px; min-width: 0; }
.lib-h { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-family: var(--f-mono); }
.lib-list { display: grid; gap: 6px; }
.item { text-align: left; width: 100%; border: 1px solid transparent; background: transparent; border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; line-height: 1.5; }
.item:hover { background: var(--surface); }
.item[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.item .nm { font-weight: 600; }
.item .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.lib-empty { font-size: 14px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.6; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.web { color: var(--good); border-color: currentColor; }
.pill.ai { color: var(--warn); border-color: currentColor; }
.pill.st-research { color: var(--muted); }
.pill.st-tested { color: var(--navy); border-color: currentColor; }
.pill.st-filmed { color: var(--amber); border-color: currentColor; }
.pill.st-posted { background: var(--good); color: var(--surface); border-color: var(--good); }

/* main */
.main { min-width: 0; display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; min-width: 0; }
.head { display: grid; gap: 12px; }
.head h1 { font-size: clamp(26px, 4vw, 40px); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--ink); font-weight: 500; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.steps .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
.step { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer; }
.step[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.banner { font-size: 14px; padding: 10px 14px; border-radius: var(--r); background: var(--amber-soft); }
.banner.ok { background: var(--navy-soft); }

.tabs-wrap { overflow-x: auto; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); min-width: max-content; }
.tab { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-size: 14px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); font-weight: 600; }

.sec { display: grid; gap: 14px; }
.sec + .sec { margin-top: 28px; }
.sec h2 { font-size: 20px; }
.sec h2 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.quote { font-family: var(--f-display); font-size: 19px; line-height: 1.7; margin: 0; padding: 4px 0; }
.list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.flag { color: var(--warn); font-weight: 600; cursor: help; }

/* note pyramid on a wear-time scale: each tier's bar spans the hours it leads the scent (ticks at 0, 30 min, 3 h, 8 h+) */
.scale { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; font-size: 12px; color: var(--muted); }
.scale .ticks { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
.scale .ticks span { position: absolute; bottom: 2px; white-space: nowrap; transform: translateX(-50%); }
.scale .ticks span:first-child { transform: none; }
.scale .ticks span:last-child { transform: translateX(-100%); }
.strip { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 18px 0 12px; border-bottom: 1px solid var(--line); }
.strip.top { --from: 0%; --to: 33.3%; }
.strip.heart { --from: 16%; --to: 66.6%; }
.strip.base { --from: 33.3%; --to: 100%; }
.tier { display: grid; align-content: start; line-height: 1.4; }
.tier b { font-family: var(--f-display); font-size: 18px; }
.tier span { font-size: 12px; color: var(--muted); }
.notes { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.notes::before { content: ""; position: absolute; top: -12px; height: 5px; left: var(--from); width: calc(var(--to) - var(--from)); border-radius: 3px; background: linear-gradient(90deg, var(--amber), var(--amber-soft)); }
.notes li { display: grid; gap: 0; }
.notes li b { font-weight: 600; }
.notes li span { color: var(--muted); font-size: 14px; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0; }
.kv dt { color: var(--muted); font-size: 14px; }
.kv dd { margin: 0; }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile h3 { font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile p { margin: 0; font-size: 14px; }
.tile .big { font-family: var(--f-display); font-size: 22px; line-height: 1.3; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--amber); }
.dots i.on { background: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); }
.pros li::marker { content: "+  "; color: var(--good); }
.cons li::marker { content: "–  "; color: var(--bad); }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
td.t { font-family: var(--f-mono); color: var(--amber); white-space: nowrap; font-size: 13px; }

.script { display: grid; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row .t { font-family: var(--f-mono); font-size: 13px; color: var(--amber); padding-top: 2px; }
.row .say { margin: 0; }
.row .shot { margin: 0; font-size: 13px; color: var(--muted); }
.row .shot::before { content: "ရိုက်ရန် · "; color: var(--amber); }
.caption { white-space: pre-wrap; margin: 0; padding: 16px; border-radius: var(--r); background: var(--bg); font-family: var(--f-body); font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar select { border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: var(--surface); font-size: 14px; }
.faq { display: grid; gap: 10px; }
.faq details { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq p { margin: 8px 0 0; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; background: var(--bg); width: 100%; }
.field textarea { min-height: 64px; resize: vertical; line-height: 1.7; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.empty { display: grid; gap: 12px; justify-items: start; }
.empty h2 { font-size: 24px; }
.empty ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.copybox { position: fixed; inset: auto max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; z-index: 30; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
.copybox textarea { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: var(--r); padding: 8px; background: var(--bg); }

@media (max-width: 860px) {
  .top { grid-template-columns: minmax(0, 1fr); }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .lib-list { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 4px; }
  .item { width: auto; min-width: 200px; background: var(--surface); border-color: var(--line); }
  .item[aria-current="true"] { border-color: var(--amber); }
  .grid3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .card { padding: 16px; }
  .new { flex-direction: column; }
  .grid2, .form { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .strip, .scale { grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
  .scale { font-size: 11px; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { .gen .dot { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mm">ရေမွေး</span><span class="en">Review Studio</span></div>
    <form id="newForm" class="new" autocomplete="off">
      <label for="newName" class="sr">ရေမွေးနာမည်</label>
      <input id="newName" name="newName" placeholder="ရေမွေးနာမည် + EDT/EDP — ဥပမာ Dior Sauvage EDP" maxlength="120">
      <button id="genBtn" class="btn primary" type="submit">Brief ထုတ်</button>
    </form>
    <div id="genStatus" class="gen" hidden></div>
    <p id="aiNote" class="note-line" hidden></p>
  </header>
  <div class="layout">
    <aside class="lib" aria-label="ရေမွေးစာရင်း">
      <p class="lib-h">Library</p>
      <div id="libList" class="lib-list"><div class="lib-empty">စာရင်း ဖွင့်နေတယ်…</div></div>
    </aside>
    <main id="main" class="main">
      <section class="card empty">
        <h2>ရေမွေးတစ်ခုချင်းစီအတွက် brief အပြည့်</h2>
        <p class="hint">Notes၊ ဘယ်ရာသီဝတ်ရမလဲ၊ နှိုင်းယှဉ်ချက်၊ အစစ်/အတု၊ Reel script၊ FB caption — တစ်နေရာတည်းမှာ။ Library ဖွင့်နေတယ်…</p>
      </section>
    </main>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const arr = v => Array.isArray(v) ? v : [];
  const str = v => (v == null ? "" : typeof v === "string" ? v : String(v));
  const obj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
  // escape, then mark every ⚠️ as a "check this" flag
  const rich = s => esc(s).replace(/⚠️?/g, '<span class="flag" title="ပြန်စစ်ရန်">⚠</span>');

  const STATUS = [["research", "Research"], ["tested", "စမ်းပြီး"], ["filmed", "ရိုက်ပြီး"], ["posted", "တင်ပြီး"]];
  const statusLabel = k => (STATUS.find(s => s[0] === k) || STATUS[0])[1];
  const TABS = [["overview", "အကျဉ်း"], ["compare", "နှိုင်းယှဉ်"], ["content", "Video & Post"], ["test", "ကိုယ်တိုင်စမ်း"], ["check", "စစ်ရန် & Sources"]];
  const SEASONS = [["hot", "နွေ", "မတ် – မေ"], ["rainy", "မိုး", "ဇွန် – အောက်တိုဘာ"], ["cool", "ဆောင်း", "နိုဝင်ဘာ – ဖေဖော်ဝါရီ"]];
  const STYLES = {
    normal: ["ပုံမှန်", "friendly and clear, like talking to a friend"],
    fun: ["ရယ်စရာ", "playful and funny, light jokes, energetic"],
    premium: ["Premium", "calm, elegant, luxurious, slow pacing"],
    short: ["၃၀ စက္ကန့်", "a 30-second version with only 4 rows"],
  };

  let db = null, sample = null, user = null;
  let canWrite = true, loaded = false, dbMissing = false;
  let perfumes = [];
  let selId = null, tab = "overview", scriptStyle = "normal";
  let job = null;           // the one running AI call: {label, ctl, chars}
  let confirmDelete = null; // id awaiting a second click
  const chains = {};

  // ---------- data shape ----------
  function normalize(b) {
    b = obj(b);
    const basics = obj(b.basics), notes = obj(b.notes), perf = obj(b.performance), seasons = obj(b.seasons), images = obj(b.images);
    const notesOf = v => arr(v).map(n => typeof n === "string" ? { note: n, mm: "" } : { note: str(obj(n).note), mm: str(obj(n).mm) }).filter(n => n.note);
    const season = v => { v = obj(v); let f = Math.round(Number(v.fit)); if (!(f >= 0 && f <= 3)) f = 0; return { fit: f, note: str(v.note) }; };
    const strs = v => arr(v).map(str).filter(Boolean);
    const pairs = v => arr(v).map(x => ({ name: str(obj(x).name), year: str(obj(x).year), diff: str(obj(x).diff) })).filter(x => x.name);
    return {
      title: str(b.title),
      basics: Object.fromEntries(["brand", "name", "concentration", "year", "perfumer", "family", "gender", "sizes", "refPrice"].map(k => [k, str(basics[k])])),
      oneLine: str(b.oneLine),
      story: strs(b.story),
      notes: { top: notesOf(notes.top), heart: notesOf(notes.heart), base: notesOf(notes.base) },
      performance: { longevity: str(perf.longevity), projection: str(perf.projection), tip: str(perf.tip) },
      seasons: { hot: season(seasons.hot), rainy: season(seasons.rainy), cool: season(seasons.cool) },
      dayNight: str(b.dayNight), occasions: strs(b.occasions), audience: str(b.audience), sprays: str(b.sprays),
      pros: strs(b.pros), cons: strs(b.cons),
      lineup: pairs(b.lineup), rivals: pairs(b.rivals), budget: pairs(b.budget),
      authenticity: strs(b.authenticity),
      script: arr(b.script).map(x => ({ time: str(obj(x).time), say: str(obj(x).say), shot: str(obj(x).shot) })).filter(x => x.say || x.shot),
      caption: str(b.caption),
      captionVariants: arr(b.captionVariants).map(x => ({ label: str(obj(x).label), text: str(obj(x).text) })).filter(x => x.text),
      images: { thumbnail: str(images.thumbnail), concept: str(images.concept), flatlay: str(images.flatlay), colors: str(images.colors) },
      imagePrompts: arr(b.imagePrompts).map(x => ({ use: str(obj(x).use), prompt: str(obj(x).prompt) })).filter(x => x.prompt),
      faq: arr(b.faq).map(x => ({ q: str(obj(x).q), a: str(obj(x).a) })).filter(x => x.q),
      uncertain: strs(b.uncertain), verify: strs(b.verify),
      sources: arr(b.sources).map(x => ({ title: str(obj(x).title), url: str(obj(x).url) })).filter(x => /^https:\/\//.test(x.url)),
    };
  }
  const titleOf = p => str(p.title) || normalize(p.brief).title || str(p.query) || "ရေမွေး";
  const sel = () => perfumes.find(p => p.id === selId) || null;

  // ---------- prompts ----------
  const SHAPE = `{
  "title": "Brand + name + concentration, e.g. \\"YSL Y Eau de Parfum\\"",
  "basics": {"brand":"","name":"","concentration":"","year":"","perfumer":"","family":"e.g. Aromatic Fougère","gender":"Men / Women / Unisex","sizes":"","refPrice":"approx. international retail in USD ⚠️"},
  "oneLine": "one Burmese sentence that sums up the scent",
  "story": ["2-3 interesting brand/concept/campaign facts worth saying on video"],
  "notes": {"top":[{"note":"Bergamot","mm":"Burmese: what it smells like"}],"heart":[],"base":[]},
  "performance": {"longevity":"e.g. ၆–၈ နာရီ","projection":"","tip":"Burmese tip for Myanmar heat"},
  "seasons": {"hot":{"fit":0,"note":""},"rainy":{"fit":0,"note":""},"cool":{"fit":0,"note":""}},
  "dayNight": "", "occasions": ["ရုံး","Date"], "audience": "", "sprays": "how many sprays in Myanmar climate",
  "pros": ["3-5"], "cons": ["3-5, honest"],
  "lineup": [{"name":"other versions in the same line","year":"","diff":""}],
  "rivals": [{"name":"2-3 competitor perfumes","diff":""}],
  "budget": [{"name":"cheaper alternatives people compare it with, if any","diff":""}],
  "authenticity": ["how to spot fakes: batch code, box, bottle, sprayer, price"],
  "script": [{"time":"0-3s","say":"Burmese line to say","shot":"what to film"}],
  "caption": "Facebook post caption",
  "images": {"thumbnail":"","concept":"","flatlay":"","colors":""},
  "faq": [{"q":"","a":""}],
  "uncertain": ["each fact you are unsure of"],
  "verify": ["what the seller should check, and where (e.g. Fragrantica page, brand site)"]
}`;

  function briefPrompt(name) {
    return `You are a fragrance research assistant for a perfume seller in Myanmar who makes Facebook review videos and posts.

Perfume to research: "${name}"

You cannot browse the web, so work from what you know. Rules:
- The exact version asked for (EDT / EDP / Parfum / Elixir) is the subject. Don't mix in other versions' notes. If no version was given, pick the best-known one and say so in "uncertain".
- If you are not sure of a fact (year, perfumer, a note, a price), give your best answer, append " ⚠️" to that value, and list it in "uncertain". If you don't know at all, write "မသိပါ".
- Never invent URLs, quotes, or review scores.
- Write every descriptive value in natural, everyday Burmese (Myanmar). Keep note names, brand and perfume names in English.
- For each note, explain in Burmese what it smells like, using comparisons familiar in Myanmar.
- Seasons are Myanmar seasons: hot (Mar–May), rainy (Jun–Oct), cool (Nov–Feb). The climate is hot and humid. "fit" is 0–3 (0 = avoid, 3 = best).
- "script" is a 60-second Facebook Reel in 5–7 rows. The first row (0-3s) is a hook that stops scrolling; the last row is a call to action (comment or message). Write "___" where the seller's own test result (hours it lasted) goes.
- "caption": Burmese, a few emoji, 5–8 hashtags, and the placeholder "[ဈေး]" for the price.
- "faq": 5 questions Myanmar customers would actually ask.

Reply with only one JSON object in exactly this shape:
${SHAPE}`;
  }

  function factsFor(p) {
    const b = normalize(p.brief);
    return JSON.stringify({ title: titleOf(p), oneLine: b.oneLine, story: b.story, notes: b.notes, performance: b.performance, seasons: b.seasons, occasions: b.occasions, pros: b.pros, cons: b.cons, rivals: b.rivals.map(r => r.name) });
  }
  function testFor(p) {
    const t = obj(p.test);
    const filled = Object.fromEntries(Object.entries(t).filter(([, v]) => str(v).trim()));
    if (str(p.price).trim()) filled.price = str(p.price);
    return JSON.stringify(filled);
  }
  function scriptPrompt(p, style) {
    return `You write Facebook Reel scripts and captions in Burmese for a perfume seller in Myanmar.

Perfume facts (JSON): ${factsFor(p)}

The seller's own test notes (JSON; may be empty). When present, use them as first-person facts and fill any "___" with them, and use "price" in place of "[ဈေး]": ${testFor(p)}

Style: ${STYLES[style][1]}.
Rules: a ${style === "short" ? "30" : "60"}-second Reel. First row (0-3s) is a hook that stops scrolling, last row is a call to action. "say" is what the seller says (Burmese), "shot" is what to film. Mention one honest weakness. The caption is Burmese with a few emoji and 5–8 hashtags.

Reply with only JSON: {"script":[{"time":"0-3s","say":"","shot":""}],"caption":""}`;
  }
  function captionsPrompt(p) {
    return `Write 3 Facebook post captions in Burmese for a perfume seller in Myanmar.
Perfume facts (JSON): ${factsFor(p)}
Seller's test notes (JSON, may be empty; use as first-person facts, and "price" replaces "[ဈေး]"): ${testFor(p)}
One short (2–3 lines), one medium, one long storytelling caption. A few emoji, 5–8 hashtags, "[ဈေး]" for price if no price is given.
Reply with only JSON: {"captions":[{"label":"တိုတို","text":""},{"label":"အလယ်အလတ်","text":""},{"label":"ရှည်ရှည်","text":""}]}`;
  }
  function imagePrompt(p) {
    return `Write 4 English prompts for an AI image generator (or Canva) for a perfume seller's Facebook page.
Perfume facts (JSON): ${factsFor(p)}
The seller photographs the real bottle, so never ask the generator to draw the bottle, logo or brand name. Each prompt describes only the background, props (the perfume's notes as real ingredients), lighting and colour mood, and leaves clear empty space in the centre for the real bottle photo.
Uses: "Thumbnail", "Flat lay (notes)", "Concept / mood", "Story 9:16".
Reply with only JSON: {"prompts":[{"use":"","prompt":""}]}`;
  }

  // ---------- writes ----------
  function deepMerge(t, s) {
    for (const [k, v] of Object.entries(s)) {
      if (v && typeof v === "object" && !Array.isArray(v) && t[k] && typeof t[k] === "object" && !Array.isArray(t[k])) deepMerge(t[k], v);
      else t[k] = v;
    }
  }
  function save(id, patch) {
    patch.updatedAt = Date.now();
    if (!db) {
      const p = perfumes.find(x => x.id === id);
      if (p) deepMerge(p, patch);
      return Promise.resolve();
    }
    const run = () => db.collection("perfumes").doc(id).update(patch);
    const next = (chains[id] || Promise.resolve()).then(run).catch(e => { toast(dbErr(e)); if (e && e.code === "invalid_argument") { canWrite = false; renderMain(); } });
    chains[id] = next;
    return next;
  }
  async function create(doc) {
    let id = str(doc.title || doc.query).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
    if (!id || perfumes.some(p => p.id === id)) id = (id ? id + "-" : "p-") + Date.now().toString(36);
    if (db) await db.collection("perfumes").doc(id).set(doc);
    else perfumes.unshift({ id, ...doc });
    return id;
  }
  async function remove(id) {
    if (db) await db.collection("perfumes").doc(id).delete();
    else perfumes = perfumes.filter(p => p.id !== id);
  }

  // ---------- AI jobs ----------
  function sampleErr(code) {
    switch (code) {
      case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
        return "ဒီ page က Claude ကို သုံးခွင့် မရသေးပါ — page ရဲ့ Permissions မှာ Claude ကို ခွင့်ပြုပါ။";
      case "rate_limited": return "အသုံးပြုမှု ကန့်သတ်ချက် ပြည့်နေပါတယ် — ခဏနေမှ ပြန်စမ်းပါ။";
      case "session_expired": return "claude.ai မှာ ပြန် sign in ဝင်ပြီး ပြန်စမ်းပါ။";
      case "invalid_json": return "AI ရဲ့ အဖြေ ပုံစံ မမှန်ပါ — ပြန်နှိပ်ကြည့်ပါ။";
      case "refused": return "AI က ဒီတောင်းဆိုမှုကို မဖြေပါ — ရေမွေးနာမည်ကို ပြင်ပြီး ပြန်စမ်းပါ။";
      case "prompt_too_large": return "ထည့်ထားတဲ့ စာ များလွန်းပါတယ် — စမ်းရလဒ် မှတ်စုကို တိုပြီး ပြန်စမ်းပါ။";
      default: return "ချိတ်ဆက်မှု ပြဿနာ ဖြစ်သွားပါတယ် — ပြန်စမ်းပါ။";
    }
  }
  function dbErr(e) {
    const c = e && e.code;
    if (c === "quota_exceeded") return "သိမ်းဆည်းခွင့် နေရာ ပြည့်နေပါတယ် — မလိုတော့တဲ့ brief တချို့ ဖျက်ပါ။";
    if (c === "invalid_argument") return "ဒီ page မှာ ပြင်ခွင့် မရှိပါ — ကြည့်ရုံသာ ရပါတယ်။";
    return "သိမ်းလို့ မရသေးပါ — ခဏနေ ပြန်စမ်းပါ။";
  }
  function renderJob(errText) {
    const el = $("#genStatus");
    if (job) {
      el.hidden = false; el.className = "gen";
      el.innerHTML = `<span class="dot"></span><span>${esc(job.label)} — ${job.chars ? `စာလုံး ${job.chars.toLocaleString()} ရေးပြီး` : "စဉ်းစားနေတယ် (၃၀ စက္ကန့် – ၂ မိနစ်)"}</span><button class="btn small" type="button" data-act="stop">ရပ်</button>`;
    } else if (errText) {
      el.hidden = false; el.className = "gen err";
      el.innerHTML = `<span class="dot"></span><span>${esc(errText)}</span><button class="btn small" type="button" data-act="dismiss">ပိတ်</button>`;
    } else { el.hidden = true; el.innerHTML = ""; }
    $("#genBtn").disabled = !!job || !sample || !canWrite;
    document.querySelectorAll("[data-ai]").forEach(b => { b.disabled = !!job || !sample || !canWrite; });
  }
  async function runJob(label, prompt, done) {
    if (job || !sample) return;
    const ctl = new AbortController();
    job = { label, ctl, chars: 0 };
    renderJob();
    try {
      const data = await sample.json(prompt, { signal: ctl.signal, onText: ({ text }) => { if (job && job.ctl === ctl) { job.chars = text.length; renderJob(); } } });
      job = null; renderJob();
      await done(obj(data));
    } catch (e) {
      job = null;
      renderJob(e && e.code === "cancelled" ? "" : sampleErr(e && e.code));
    }
  }

  function generateBrief(name) {
    runJob(`"${name}" brief ရေးနေတယ်`, briefPrompt(name), async data => {
      const brief = normalize(data);
      const now = Date.now();
      const id = await create({ title: brief.title || name, query: name, origin: "ai", status: "research", createdAt: now, updatedAt: now, price: "", test: {}, brief: data });
      selId = id; tab = "overview";
      $("#newName").value = "";
      renderAll();
      toast("Brief အသစ် သိမ်းပြီးပါပြီ");
    });
  }
  function regenScript(p) {
    runJob("Script + caption ပြန်ရေးနေတယ်", scriptPrompt(p, scriptStyle), async data => {
      const script = arr(data.script), caption = str(data.caption);
      if (!script.length) { renderJob(sampleErr("invalid_json")); return; }
      await save(p.id, { brief: { script, caption } });
      renderMain(); toast("Script အသစ် သိမ်းပြီး");
    });
  }
  function regenCaptions(p) {
    runJob("Caption ၃ မျိုး ရေးနေတယ်", captionsPrompt(p), async data => {
      const captionVariants = arr(data.captions);
      if (!captionVariants.length) { renderJob(sampleErr("invalid_json")); return; }
      await save(p.id, { brief: { captionVariants } });
      renderMain(); toast("Caption ၃ မျိုး သိမ်းပြီး");
    });
  }
  function regenImages(p) {
    runJob("Image prompt ရေးနေတယ်", imagePrompt(p), async data => {
      const imagePrompts = arr(data.prompts);
      if (!imagePrompts.length) { renderJob(sampleErr("invalid_json")); return; }
      await save(p.id, { brief: { imagePrompts } });
      renderMain(); toast("Image prompt သိမ်းပြီး");
    });
  }

  // ---------- copy & export ----------
  async function copy(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const old = btn.textContent; btn.textContent = "ကူးပြီး ✓"; setTimeout(() => { btn.textContent = old; }, 1400);
    } catch {
      const box = document.createElement("div");
      box.className = "copybox";
      box.innerHTML = `<p class="hint">အောက်ကစာကို select လုပ်ပြီး copy ကူးပါ</p><textarea id="copyArea" readonly></textarea><div class="toolbar"><button class="btn" type="button">ပိတ်</button></div>`;
      document.body.append(box);
      const ta = box.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
      box.querySelector("button").onclick = () => box.remove();
    }
  }
  const scriptText = b => b.script.map(r => `[${r.time}] ${r.say}${r.shot ? `\n   (ရိုက်ရန်: ${r.shot})` : ""}`).join("\n\n");
  function toMarkdown(p) {
    const b = normalize(p.brief), t = obj(p.test);
    const L = [];
    const list = a => a.forEach(x => L.push(`- ${x}`));
    L.push(`# ${titleOf(p)}`, "", `> ${p.origin === "web" ? "Web research" : "AI draft (web မရှာထားပါ — ⚠️ တွေ ပြန်စစ်ရန်)"} · အခြေအနေ: ${statusLabel(p.status)}`, "");
    if (b.oneLine) L.push(`**${b.oneLine}**`, "");
    L.push("## အခြေခံ", "");
    [["Brand", "brand"], ["နာမည်", "name"], ["Concentration", "concentration"], ["ထွက်နှစ်", "year"], ["Perfumer", "perfumer"], ["Family", "family"], ["ကျား/မ", "gender"], ["Size", "sizes"], ["ရည်ညွှန်းဈေး", "refPrice"]].forEach(([l, k]) => { if (b.basics[k]) L.push(`- ${l}: ${b.basics[k]}`); });
    if (p.price) L.push(`- ဆိုင်ဈေး: ${p.price}`);
    if (b.story.length) { L.push("", "## ဇာတ်လမ်း / Concept", ""); list(b.story); }
    L.push("", "## Notes", "");
    [["Top", "top"], ["Heart", "heart"], ["Base", "base"]].forEach(([l, k]) => { L.push(`**${l}:**`); b.notes[k].forEach(n => L.push(`- ${n.note}${n.mm ? ` — ${n.mm}` : ""}`)); L.push(""); });
    L.push("## ခံချိန် / ပျံ့နှံ့မှု", "", `- Longevity: ${b.performance.longevity}`, `- Projection: ${b.performance.projection}`);
    if (t.hours) L.push(`- ကိုယ်တိုင်စမ်း: ${t.hours} နာရီ`);
    if (b.performance.tip) L.push(`- ${b.performance.tip}`);
    L.push("", "## မြန်မာ ရာသီ", "");
    SEASONS.forEach(([k, l]) => L.push(`- ${l} (${b.seasons[k].fit}/3): ${b.seasons[k].note}`));
    if (b.occasions.length) L.push(`- အခါသမယ: ${b.occasions.join("၊ ")}`);
    if (b.sprays) L.push(`- ဖျန်းနည်း: ${b.sprays}`);
    L.push("", "## ကောင်းကွက်", ""); list(b.pros);
    L.push("", "## အားနည်းကွက်", ""); list(b.cons);
    if (b.lineup.length || b.rivals.length) { L.push("", "## နှိုင်းယှဉ်ချက်", ""); [...b.lineup, ...b.rivals, ...b.budget].forEach(x => L.push(`- **${x.name}**${x.year ? ` (${x.year})` : ""} — ${x.diff}`)); }
    if (b.authenticity.length) { L.push("", "## အစစ်/အတု ခွဲနည်း", ""); list(b.authenticity); }
    L.push("", "## Reel Script", "", scriptText(b), "", "## FB Caption", "", b.caption);
    if (b.faq.length) { L.push("", "## FAQ", ""); b.faq.forEach(f => L.push(`**${f.q}**`, f.a, "")); }
    const tested = [["၁၅ မိနစ်", "t15"], ["၂ နာရီ", "t2h"], ["၆ နာရီ", "t6h"], ["ဘေးကလူ", "compliments"], ["ကိုယ့်အမြင်", "verdict"]].filter(([, k]) => str(t[k]).trim());
    if (tested.length) { L.push("", "## ကိုယ်တိုင်စမ်းရလဒ်", ""); tested.forEach(([l, k]) => L.push(`- ${l}: ${t[k]}`)); }
    if (b.uncertain.length) { L.push("", "## ⚠️ ပြန်စစ်ရန်", ""); list(b.uncertain); }
    if (b.sources.length) { L.push("", "## Sources", ""); b.sources.forEach(s => L.push(`- [${s.title || s.url}](${s.url})`)); }
    return L.join("\n");
  }

        ${dbMissing ? noDbNote() : ""}
        ${canWrite ? "" : `<p class="hint">ကြည့်ရုံသာ ရပါတယ် — ပြင်ခွင့် မရှိပါ။</p>`}
      </section>
      <section class="card">
        <div class="tabs-wrap"><div class="tabs" role="tablist">${TABS.map(([k, l]) => `<button class="tab" type="button" role="tab" data-tab="${k}" aria-selected="${k === tab}">${esc(l)}</button>`).join("")}</div></div>
        <div style="margin-top:22px">${({ overview, compare, content, test, check })[tab](p, b)}</div>
      </section>`;
    renderJob();
  }
  const noDbNote = () => `<p class="hint">ဒီ view မှာ သိမ်းဆည်းလို့ မရပါ — claude.ai မှာ sign in ဝင်ပြီး ဖွင့်ရင် brief တွေ သိမ်းထားနိုင်မယ်။ အခု ထုတ်တဲ့ brief တွေက page ပိတ်ရင် ပျောက်မယ်။</p>`;

  function overview(p, b) {
    const t = obj(p.test);
    const strip = (k, label, when) => `
      <div class="strip ${k}">
        <div class="tier"><b>${label}</b><span>${when}</span></div>
        <ul class="notes">${b.notes[k].map(n => `<li><b>${rich(n.note)}</b>${n.mm ? `<span>${rich(n.mm)}</span>` : ""}</li>`).join("") || `<li><span>—</span></li>`}</ul>
      </div>`;
    const basics = [["Brand", "brand"], ["နာမည်", "name"], ["Concentration", "concentration"], ["Size", "sizes"], ["ရည်ညွှန်းဈေး", "refPrice"]].filter(([, k]) => b.basics[k]);
    return `
      ${b.oneLine ? `<div class="sec"><p class="quote">${rich(b.oneLine)}</p></div>` : ""}
      <div class="sec">
        <h2>Notes <small>အရိပ်ရှည်လေ ပိုကြာကြာ ကျန်လေ</small></h2>
        <div>
          <div class="scale"><span></span><div class="ticks"><span style="left:0">ဖျန်းချိန်</span><span style="left:33.3%">၃၀ မိနစ်</span><span style="left:66.6%">၃ နာရီ</span><span style="left:100%">၈ နာရီ+</span></div></div>
          ${strip("top", "Top", "ပထမ ၁၅–၃၀ မိနစ်")}
          ${strip("heart", "Heart", "၃၀ မိနစ် – ၃ နာရီ")}
          ${strip("base", "Base", "နောက်ဆုံး ကျန်မယ့်အနံ့")}
        </div>
      </div>
      <div class="sec">
        <h2>မြန်မာ ရာသီ</h2>
        <div class="grid3">${SEASONS.map(([k, l, m]) => `
          <div class="tile">
            <h3><span>${l}</span><span class="dots" aria-label="${b.seasons[k].fit} / 3">${[1, 2, 3].map(i => `<i class="${i <= b.seasons[k].fit ? "on" : ""}"></i>`).join("")}</span></h3>
            <p class="hint">${m}</p>
            <p>${rich(b.seasons[k].note) || "—"}</p>
          </div>`).join("")}</div>
        <div class="chips">${b.occasions.map(o => `<span class="chip">${esc(o)}</span>`).join("")}</div>
        <dl class="kv">
          ${b.dayNight ? `<dt>နေ့ / ည</dt><dd>${rich(b.dayNight)}</dd>` : ""}
          ${b.audience ? `<dt>ဘယ်သူနဲ့ကိုက်လဲ</dt><dd>${rich(b.audience)}</dd>` : ""}
          ${b.sprays ? `<dt>ဖျန်းနည်း</dt><dd>${rich(b.sprays)}</dd>` : ""}
        </dl>
      </div>
      <div class="sec">
        <h2>ခံချိန် & ပျံ့နှံ့မှု</h2>
        <div class="grid3">
          <div class="tile"><p class="hint">Longevity (online)</p><p class="big">${rich(b.performance.longevity) || "—"}</p></div>
          <div class="tile"><p class="hint">Projection (online)</p><p>${rich(b.performance.projection) || "—"}</p></div>
          <div class="tile"><p class="hint">ကိုယ်တိုင်စမ်း</p><p class="big">${str(t.hours).trim() ? `${esc(t.hours)} နာရီ` : "—"}</p>${str(t.hours).trim() ? "" : `<p><button class="btn small" type="button" data-tab="test">စမ်းရလဒ် ဖြည့်</button></p>`}</div>
        </div>
        ${b.performance.tip ? `<p class="hint">${rich(b.performance.tip)}</p>` : ""}
      </div>
      ${b.story.length ? `<div class="sec"><h2>Brand ဇာတ်လမ်း <small>video မှာ ပြောလို့ကောင်းတာ</small></h2><ul class="list">${b.story.map(s => `<li>${rich(s)}</li>`).join("")}</ul></div>` : ""}
      ${basics.length ? `<div class="sec"><h2>အခြေခံ</h2><dl class="kv">${basics.map(([l, k]) => `<dt>${l}</dt><dd>${rich(b.basics[k])}</dd>`).join("")}${p.price ? `<dt>ဆိုင်ဈေး</dt><dd>${esc(p.price)}</dd>` : ""}</dl></div>` : ""}`;
  }

  function compare(p, b) {
    const table = (rows, withYear) => rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>ရေမွေး</th>${withYear ? "<th>ထွက်နှစ်</th>" : ""}<th>ဘာကွာလဲ</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${rich(r.name)}</b></td>${withYear ? `<td class="t">${rich(r.year)}</td>` : ""}<td>${rich(r.diff)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="hint">—</p>`;
    return `
      <div class="sec">
        <h2>ကောင်းကွက် / အားနည်းကွက်</h2>
        <div class="grid2">
          <div class="tile"><h3>ကောင်းကွက်</h3><ul class="list pros">${b.pros.map(x => `<li>${rich(x)}</li>`).join("")}</ul></div>
          <div class="tile"><h3>အားနည်းကွက်</h3><ul class="list cons">${b.cons.map(x => `<li>${rich(x)}</li>`).join("")}</ul></div>
        </div>
      </div>
      <div class="sec"><h2>Line ထဲက တခြား version</h2>${table(b.lineup, true)}</div>
      <div class="sec"><h2>ယှဉ်ပြိုင်ဘက်</h2>${table(b.rivals, false)}</div>
      ${b.budget.length ? `<div class="sec"><h2>ဈေးသက်သာတဲ့ အလားတူ <small>ကိုယ်တိုင်စမ်းရန်</small></h2>${table(b.budget, false)}</div>` : ""}
      <div class="sec"><h2>အစစ်/အတု ခွဲနည်း</h2><ul class="list">${b.authenticity.map(x => `<li>${rich(x)}</li>`).join("")}</ul></div>`;
  }

  function content(p, b) {
    const ai = `data-ai ${job || !sample || !canWrite ? "disabled" : ""}`;
    const hasTest = Object.values(obj(p.test)).some(v => str(v).trim()) || str(p.price).trim();
    return `
      <div class="sec">
        <h2>Reel Script</h2>
        <div class="toolbar">
          <button class="btn" type="button" data-copy="script">Script ကူး</button>
          <label for="styleSel" class="sr">ပုံစံ</label>
          <select id="styleSel">${Object.entries(STYLES).map(([k, [l]]) => `<option value="${k}" ${k === scriptStyle ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
          <button class="btn" type="button" data-act="script" ${ai}>${hasTest ? "စမ်းရလဒ်နဲ့ ပြန်ရေး" : "ပြန်ရေး"}</button>
        </div>
        ${hasTest ? "" : `<p class="hint">ကိုယ်တိုင်စမ်း tab မှာ ရလဒ်ဖြည့်ပြီးမှ ပြန်ရေးရင် ___ နေရာတွေကို ကိုယ့်ရလဒ်နဲ့ ဖြည့်ပေးမယ်။</p>`}
        <div class="script">${b.script.map(r => `<div class="row"><span class="t">${esc(r.time)}</span><p class="say">${rich(r.say)}</p><p class="shot">${rich(r.shot)}</p></div>`).join("") || `<p class="hint">Script မရှိသေးပါ</p>`}</div>
      </div>
      <div class="sec">
        <h2>FB Post Caption</h2>
        <div class="toolbar"><button class="btn" type="button" data-copy="caption">Caption ကူး</button><button class="btn" type="button" data-act="captions" ${ai}>Caption ၃ မျိုး ရေး</button></div>
        <pre class="caption">${esc(b.caption) || "—"}</pre>
        ${b.captionVariants.map((c, i) => `<div class="toolbar"><b>${esc(c.label)}</b><button class="btn small" type="button" data-copy="variant" data-i="${i}">ကူး</button></div><pre class="caption">${esc(c.text)}</pre>`).join("")}
      </div>
      <div class="sec">
        <h2>ပုံ / Image idea</h2>
        <dl class="kv">
          ${[["Thumbnail", "thumbnail"], ["Concept shot", "concept"], ["Flat lay", "flatlay"], ["အရောင် mood", "colors"]].filter(([, k]) => b.images[k]).map(([l, k]) => `<dt>${l}</dt><dd>${rich(b.images[k])}</dd>`).join("")}
        </dl>
        <p class="hint">ပုလင်းကို AI နဲ့ မဆွဲပါနဲ့ — ပုလင်းက ကိုယ်တိုင်ရိုက်တဲ့ ဓာတ်ပုံ၊ နောက်ခံကိုပဲ AI / Canva နဲ့ လုပ်ပါ။</p>
        <div class="toolbar"><button class="btn" type="button" data-act="images" ${ai}>AI image prompt ရေး (English)</button></div>
        ${b.imagePrompts.map((x, i) => `<div class="tile"><h3><span>${esc(x.use)}</span><button class="btn small" type="button" data-copy="img" data-i="${i}">ကူး</button></h3><p>${esc(x.prompt)}</p></div>`).join("")}
      </div>
      ${b.faq.length ? `<div class="sec"><h2>Customer မေးမယ့် မေးခွန်း</h2><div class="faq">${b.faq.map(f => `<details><summary>${rich(f.q)}</summary><p>${rich(f.a)}</p></details>`).join("")}</div></div>` : ""}`;
  }

  function test(p) {
    const t = obj(p.test);
    const dis = canWrite ? "" : "disabled";
    const area = (k, label, ph, wide) => `<div class="field ${wide ? "wide" : ""}"><label for="t-${k}">${label}</label><textarea id="t-${k}" data-test="${k}" placeholder="${esc(ph)}" ${dis}>${esc(t[k])}</textarea></div>`;
    return `
      <div class="sec">
        <h2>ကိုယ်တိုင်စမ်းရလဒ် <small>AI မလုပ်နိုင်တဲ့ အပိုင်း — review ရဲ့ အသက်</small></h2>
        <p class="hint">လက်ကောက်ဝတ် (သို့) လည်ပင်းမှာ ၂ ချက်ဖျန်းပြီး အချိန်အလိုက် မှတ်ပါ။ ဖြည့်ပြီးတာနဲ့ အလိုလို သိမ်းတယ်။</p>
        <div class="form">
          ${area("t15", "ဖျန်းပြီး ၁၅ မိနစ်", "ဥပမာ ပန်းသီးနံ့ သိသာတယ်၊ ချင်းနံ့ နည်းနည်း")}
          ${area("t2h", "၂ နာရီ", "ဥပမာ ဟင်းခတ်ရွက်နံ့ ပြောင်းလာတယ်")}
          ${area("t6h", "၆ နာရီ", "ဥပမာ အရေပြားနားကပ်မှ နံ့တော့တယ်")}
          <div class="field"><label for="t-hours">ခံချိန် (နာရီ)</label><input id="t-hours" data-test="hours" inputmode="decimal" placeholder="ဥပမာ 7" value="${esc(t.hours)}" ${dis}></div>
          <div class="field"><label for="t-weather">စမ်းတဲ့နေ့ ရာသီဥတု</label><input id="t-weather" data-test="weather" placeholder="ဥပမာ ပူတယ် 34°C၊ ရုံးထဲ AC" value="${esc(t.weather)}" ${dis}></div>
          ${area("compliments", "ဘေးကလူ သတိထားမိလား", "ဥပမာ သူငယ်ချင်း ၂ ယောက် မေးတယ်", true)}
          ${area("verdict", "ကိုယ့်အမြင် တစ်ကြောင်း", "ဥပမာ ရုံးအတွက် အကောင်းဆုံး၊ ညဘက်အတွက်တော့ ပေါ့တယ်", true)}
        </div>
      </div>
      <div class="sec">
        <h2>ဆိုင်အချက်အလက်</h2>
        <div class="form">
          <div class="field"><label for="p-price">ဆိုင်ဈေး</label><input id="p-price" data-field="price" placeholder="ဥပမာ 100ml — 350,000 ကျပ်" value="${esc(p.price)}" ${dis}></div>
        </div>
        <div class="toolbar"><button class="btn" type="button" data-tab="content">Video & Post ကို သွား →</button></div>
      </div>`;
  }

  function check(p, b) {
    return `
      <div class="sec">
        <h2>⚠️ ပြန်စစ်ရန်</h2>
        ${b.uncertain.length ? `<ul class="list">${b.uncertain.map(x => `<li>${rich(x)}</li>`).join("")}</ul>` : `<p class="hint">မသေချာတာ မမှတ်ထားပါ။</p>`}
        ${b.verify.length ? `<h3 style="font-size:16px">ဘယ်မှာ စစ်ရမလဲ</h3><ul class="list">${b.verify.map(x => `<li>${rich(x)}</li>`).join("")}</ul>` : ""}
      </div>
      <div class="sec">
        <h2>Sources</h2>
        ${b.sources.length
          ? `<ul class="list">${b.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url)}</a></li>`).join("")}</ul>`
          : `<p class="hint">AI draft ဖြစ်လို့ source link မရှိပါ။ Web research နဲ့ စစ်ချင်ရင် Claude ကို "Studio ထဲက ${esc(titleOf(p))} ကို web research လုပ်ပြီး update လုပ်ပေး" လို့ ပြောပါ။</p>`}
      </div>
      <div class="sec">
        <h2>Export / ဖျက်</h2>
        <div class="toolbar">
          <button class="btn" type="button" data-copy="md">Brief အပြည့် ကူး (Markdown)</button>
          ${canWrite ? `<button class="btn danger" type="button" data-act="delete">${confirmDelete === p.id ? "သေချာလား? ထပ်နှိပ်ရင် ဖျက်မယ်" : "ဒီ brief ကို ဖျက်"}</button>` : ""}
        </div>
      </div>`;
  }

  // ---------- events ----------
  $("#newForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("#newName").value.trim();
    if (!name) { $("#newName").focus(); toast("ရေမွေးနာမည် ရိုက်ပါ"); return; }
    if (!sample) { toast("ဒီ view မှာ AI မသုံးနိုင်ပါ"); return; }
    generateBrief(name);
  });

  document.addEventListener("click", e => {
    const el = e.target.closest("button");
    if (!el) return;
    const p = sel();
    if (el.dataset.sel) { selId = el.dataset.sel; confirmDelete = null; renderLib(); renderMain(); return; }
    if (el.dataset.tab) { tab = el.dataset.tab; confirmDelete = null; renderMain(); return; }
    if (el.dataset.status && p) { save(p.id, { status: el.dataset.status }); if (!db) renderAll(); return; }
    if (el.dataset.copy && p) {
      const b = normalize(p.brief);
      const i = Number(el.dataset.i);
      const text = { script: () => scriptText(b), caption: () => b.caption, variant: () => (b.captionVariants[i] || {}).text, img: () => (b.imagePrompts[i] || {}).prompt, md: () => toMarkdown(p) }[el.dataset.copy]();
      copy(str(text), el); return;
    }
    const act = el.dataset.act;
    if (act === "stop") { job && job.ctl.abort(); return; }
    if (act === "dismiss") { renderJob(); return; }
    if (!p) return;
    if (act === "script") regenScript(p);
    else if (act === "captions") regenCaptions(p);
    else if (act === "images") regenImages(p);
    else if (act === "delete") {
      if (confirmDelete !== p.id) { confirmDelete = p.id; renderMain(); return; }
      confirmDelete = null;
      const id = p.id;
      remove(id).then(() => { if (!db) { selId = perfumes[0]?.id ?? null; renderAll(); } toast("ဖျက်ပြီးပါပြီ"); }).catch(err => toast(dbErr(err)));
    }
  });

  document.addEventListener("change", e => {
    const el = e.target, p = sel();
    if (el.id === "styleSel") { scriptStyle = el.value in STYLES ? el.value : "normal"; return; }
    if (!p || !canWrite) return;
    if (el.dataset.test) save(p.id, { test: { [el.dataset.test]: el.value.trim() } });
    else if (el.dataset.field === "price") save(p.id, { price: el.value.trim() });
  });

  // ---------- boot ----------
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

  renderAll();
  use("sample").then(s => {
    sample = s;
    const note = $("#aiNote");
    note.hidden = false;
    note.textContent = s
      ? "Brief ထုတ်ရင် ကိုယ့် Claude အကောင့်ကို သုံးပါတယ် (ပထမဆုံးအကြိမ် ခွင့်ပြုချက် မေးမယ်)။ AI က web မရှာနိုင်လို့ ⚠️ တွေကို ပြန်စစ်ပါ။"
      : "ဒီ view မှာ AI နဲ့ brief မထုတ်နိုင်ပါ — claude.ai ထဲမှာ ဖွင့်ပါ။ သိမ်းထားတဲ့ brief တွေကိုတော့ ကြည့်လို့ရတယ်။";
    renderJob();
  });
  use("user").then(async u => {
    user = u;
    if (u) { try { const w = await u.can("data.write"); if (w === false) { canWrite = false; renderAll(); } } catch {} }
  });
  use("db").then(d => {
    db = d;
    if (!d) { dbMissing = true; loaded = true; renderAll(); return; }
    d.collection("perfumes").orderBy("createdAt", "desc").onSnapshot(snap => {
      perfumes = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      loaded = true;
      if (!selId || !perfumes.some(p => p.id === selId)) selId = perfumes[0] ? perfumes[0].id : null;
      renderLib();
      const ae = document.activeElement;
      if (ae && $("#main").contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return; // don't wipe what the viewer is typing
      renderMain();
    }, () => { dbMissing = true; loaded = true; renderAll(); });
  });
})();
</script>
